[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "maturin-flask-demo"
version = "0.1.0"
description = "A small Flask demo comparing Python and Rust with maturin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.maturin]
python-source = "python"
module-name = "maturin_demo._native"

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
